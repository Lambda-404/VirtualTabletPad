name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm/cache
            /tmp/VirtualTabletPadBuild/SourcePackages
            /tmp/VPadProtocolBuild
          key: ${{ runner.os }}-spm-${{ hashFiles('Packages/VPadProtocol/Package.swift', 'project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Run VPadProtocol unit tests
        run: make test

      - name: Build MacHost (macOS)
        run: make build

      - name: Build iPadClient (iOS Simulator)
        run: make ipad-build
