name: VirtualTabletPad
options:
  bundleIdPrefix: com.vpad
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.5"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  VPadProtocol:
    path: Packages/VPadProtocol

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.5.0"

targets:
  MacHost:
    type: application
    platform: macOS
    sources:
      - path: MacHost
        excludes:
          - "Info.plist"
    dependencies:
      - package: VPadProtocol
        product: VPadProtocol
    info:
      path: MacHost/Info.plist
      properties:
        CFBundleDisplayName: VirtualTabletPad
        CFBundleName: VirtualTabletPad
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        LSMultipleInstancesProhibited: true
        NSLocalNetworkUsageDescription: "Connects to your iPad to receive trackpad, stylus, keyboard and file input."
        NSBonjourServices:
          - _vpad._udp
          - _vpad-tcp._tcp
        NSAppleEventsUsageDescription: "Runs user-mapped gesture scripts via AppleScript."
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.productivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vpad.MacHost
        PRODUCT_NAME: VirtualTabletPad
        CURRENT_PROJECT_VERSION: "10"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        COMBINE_HIDPI_IMAGES: YES

  iPadClient:
    type: application
    platform: iOS
    sources:
      - path: iPadClient
        excludes:
          - "Info.plist"
    dependencies:
      - package: VPadProtocol
        product: VPadProtocol
    info:
      path: iPadClient/Info.plist
      properties:
        CFBundleDisplayName: VirtualTabletPad
        CFBundleName: VirtualTabletPad
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIApplicationSupportsIndirectInputEvents: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: "Discovers your Mac and sends encrypted trackpad, stylus, keyboard and file input."
        NSCameraUsageDescription: "Scans the Mac's pairing QR code."
        NSBonjourServices:
          - _vpad._udp
          - _vpad-tcp._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vpad.iPadClient
        PRODUCT_NAME: VirtualTabletPad
        CURRENT_PROJECT_VERSION: "28"
        IPHONEOS_DEPLOYMENT_TARGET: "17.5"
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: NO

schemes:
  MacHost:
    build:
      targets:
        MacHost: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  iPadClient:
    build:
      targets:
        iPadClient: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
