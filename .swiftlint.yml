# Minimal SwiftLint configuration for VirtualTabletPad

included:
  - Packages/VPadProtocol
  - MacHost
  - iPadClient

excluded:
  - .build
  - build
  - DerivedData
  - .tools
  - .swiftpm
  - VirtualTabletPad.xcodeproj

disabled_rules:
  - line_length
  - type_body_length
  - file_length
  - function_body_length
  - cyclomatic_complexity
  - function_parameter_count
  - identifier_name
  - trailing_whitespace
  - todo

opt_in_rules:
  - empty_count
  - fatal_error_message
  - unused_import

warning_threshold: 50
