<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1024 1024"
     width="1024"
     height="1024"
     fill="none">
  <title>VirtualTabletPad App Icon (1024x1024 Apple HIG)</title>
  <desc>Full-bleed 1024x1024 app icon for VirtualTabletPad (macOS Host + iPad Client) featuring the 16:10 #121214 active canvas, 240 Hz fading cyan transient ink trail, radial hover HUD, Apple Pencil Pro stylus with 3D barrel-roll ring, E2EE status badge, and synthesized macOS cursor.</desc>

  <defs>
    <!-- 1. Full-Bleed Opaque Master Background (Apple HIG compliant: 1024x1024, zero alpha transparency) -->
    <linearGradient id="bgMaster" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181B26"/>
      <stop offset="48%" stop-color="#111217"/>
      <stop offset="100%" stop-color="#08090D"/>
    </linearGradient>

    <!-- Ambient Cyan/Indigo Backlight Glow -->
    <radialGradient id="ambientCyan" cx="480" cy="540" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.24"/>
      <stop offset="48%" stop-color="#2563EB" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#121214" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ambientTopRight" cx="760" cy="260" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#090A0F" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle inner squircle vignette / sheen for Apple HIG depth -->
    <linearGradient id="higSheen" x1="512" y1="64" x2="512" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="75%" stop-color="#000000" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.14"/>
    </linearGradient>

    <!-- 2. 16:10 Active Tablet Canvas Surface (#121214 to #18191E) -->
    <linearGradient id="tabletBody" x1="136" y1="236" x2="888" y2="808" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#20222B"/>
      <stop offset="50%" stop-color="#14151A"/>
      <stop offset="100%" stop-color="#0D0E12"/>
    </linearGradient>

    <!-- Tablet Specular Rim (#2C2C30 + Cyan Highlight) -->
    <linearGradient id="tabletRim" x1="136" y1="236" x2="888" y2="808" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.72"/>
      <stop offset="32%" stop-color="#2C2C30" stop-opacity="0.95"/>
      <stop offset="72%" stop-color="#2C2C30" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Inner 16:10 Active Rect Surface (#121214 spec from README) -->
    <linearGradient id="activeCanvas" x1="176" y1="274" x2="848" y2="764" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#15161B"/>
      <stop offset="55%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#0E0F12"/>
    </linearGradient>

    <!-- 3. Transient Ink Layer Gradient (Fading Cyan Trail) -->
    <linearGradient id="cyanInk" x1="256" y1="658" x2="576" y2="484" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.12"/>
      <stop offset="25%" stop-color="#3B82F6" stop-opacity="0.52"/>
      <stop offset="62%" stop-color="#00D2FF" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="1.0"/>
    </linearGradient>

    <linearGradient id="cyanInkCore" x1="276" y1="658" x2="566" y2="492" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.0"/>
      <stop offset="38%" stop-color="#22D3EE" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#ECFEFF" stop-opacity="1.0"/>
    </linearGradient>

    <!-- Touch / Hover Point Radial Glow -->
    <radialGradient id="hoverGlow" cx="566" cy="492" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.58"/>
      <stop offset="35%" stop-color="#00E5FF" stop-opacity="0.24"/>
      <stop offset="70%" stop-color="#0284C7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.0"/>
    </radialGradient>

    <!-- 4. Apple Pencil Pro Gradients -->
    <linearGradient id="pencilBody" x1="-26" y1="0" x2="26" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="22%" stop-color="#F8FAFC"/>
      <stop offset="48%" stop-color="#FFFFFF"/>
      <stop offset="78%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <linearGradient id="pencilFacet" x1="-11" y1="0" x2="11" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <linearGradient id="pencilCone" x1="-25" y1="0" x2="25" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="30%" stop-color="#F1F5F9"/>
      <stop offset="55%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <linearGradient id="pencilNib" x1="-10" y1="-22" x2="10" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Mac Cursor Gradient -->
    <linearGradient id="macCursorGrad" x1="0" y1="0" x2="60" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="tabletShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#000000" flood-opacity="0.70"/>
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#00E5FF" flood-opacity="0.14"/>
    </filter>

    <filter id="inkBloom" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="pencilShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-14" dy="24" stdDeviation="16" flood-color="#020617" flood-opacity="0.68"/>
    </filter>

    <filter id="cursorShadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.60"/>
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#38BDF8" flood-opacity="0.50"/>
    </filter>

    <clipPath id="activeCanvasClip">
      <rect x="180" y="280" width="664" height="476" rx="44"/>
    </clipPath>
  </defs>

  <!-- ========================================================================= -->
  <!-- LAYER 1: FULL-BLEED 1024x1024 BACKGROUND (Apple App Store & HIG Compliant) -->
  <!-- ========================================================================= -->
  <rect width="1024" height="1024" fill="url(#bgMaster)"/>
  <rect width="1024" height="1024" fill="url(#ambientCyan)"/>
  <rect width="1024" height="1024" fill="url(#ambientTopRight)"/>

  <!-- Subtle concentric architectural framing rings -->
  <g opacity="0.11" stroke="#38BDF8" stroke-width="1.5">
    <circle cx="512" cy="512" r="426" stroke-dasharray="6 10"/>
    <circle cx="512" cy="512" r="340"/>
  </g>


  <!-- ========================================================================= -->
  <!-- LAYER 2: MAC HOST WINDOW FRAME (Upper Offset Floating Glass Layer)         -->
  <!-- Symbolizes the macOS Host receiving E2EE UDP input & CGEvent stream       -->
  <!-- ========================================================================= -->
  <g opacity="0.78">
    <rect x="172" y="176" width="628" height="410" rx="52"
          fill="#171A24" stroke="#38BDF8" stroke-opacity="0.32" stroke-width="2.5"/>
    <!-- macOS Traffic Light Window Controls -->
    <circle cx="222" cy="216" r="7.5" fill="#38BDF8" fill-opacity="0.75"/>
    <circle cx="246" cy="216" r="7.5" fill="#475569" fill-opacity="0.70"/>
    <circle cx="270" cy="216" r="7.5" fill="#475569" fill-opacity="0.70"/>
    <!-- Menu Bar Host Status Pill -->
    <rect x="416" y="210" width="140" height="12" rx="6" fill="#38BDF8" fill-opacity="0.25"/>
    <circle cx="752" cy="216" r="6" fill="#10B981" fill-opacity="0.85"/>
  </g>

  <!-- ========================================================================= -->
  <!-- LAYER 3: iPAD 16:10 HYBRID CANVAS TABLET (Primary Hero Object)            -->
  <!-- ========================================================================= -->
  <g filter="url(#tabletShadow)">
    <!-- Outer iPad / Tablet Chassis -->
    <rect x="140" y="244" width="744" height="548" rx="68"
          fill="url(#tabletBody)"
          stroke="url(#tabletRim)"
          stroke-width="5"/>

    <!-- Inner Bezel Specular Highlight -->
    <rect x="150" y="254" width="724" height="528" rx="60"
          stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>

    <!-- 16:10 Active Canvas Region (#121214 background + #2C2C30 border per README) -->
    <rect x="180" y="280" width="664" height="476" rx="44"
          fill="url(#activeCanvas)"
          stroke="#2C2C30"
          stroke-width="4"/>
  </g>

  <!-- ========================================================================= -->
  <!-- LAYER 4: CANVAS INTERNAL DETAILS (Grid, Modifier Sidebar, 16:10 Reticle)  -->
  <!-- ========================================================================= -->
  <g clip-path="url(#activeCanvasClip)">
    <!-- Precision Coordinate Grid -->
    <g stroke="#2C2C34" stroke-width="1.5" opacity="0.55">
      <line x1="313" y1="280" x2="313" y2="756"/>
      <line x1="446" y1="280" x2="446" y2="756"/>
      <line x1="579" y1="280" x2="579" y2="756"/>
      <line x1="712" y1="280" x2="712" y2="756"/>
      <line x1="180" y1="399" x2="844" y2="399"/>
      <line x1="180" y1="518" x2="844" y2="518"/>
      <line x1="180" y1="637" x2="844" y2="637"/>
    </g>

    <!-- Left Modifier Sidebar Pill (Cmd / Shift / Option / Control / Space) -->
    <rect x="204" y="342" width="40" height="352" rx="20"
          fill="#1C1E26" stroke="#2C2C30" stroke-width="2"/>
    <rect x="212" y="358" width="24" height="54" rx="10" fill="#2A2D37"/>
    <!-- Active Momentary Modifier Key (Glowing Cyan) -->
    <rect x="212" y="424" width="24" height="54" rx="10"
          fill="#00E5FF" fill-opacity="0.28" stroke="#38BDF8" stroke-width="1.75"/>
    <rect x="212" y="490" width="24" height="54" rx="10" fill="#2A2D37"/>
    <rect x="212" y="556" width="24" height="120" rx="10" fill="#252832"/>

    <!-- 16:10 Active Area Corner Brackets -->
    <g stroke="#38BDF8" stroke-width="3.2" stroke-linecap="round" opacity="0.72">
      <!-- Top-Left -->
      <path d="M 270 334 L 270 312 L 292 312"/>
      <!-- Top-Right -->
      <path d="M 790 312 L 812 312 L 812 334"/>
      <!-- Bottom-Left -->
      <path d="M 270 702 L 270 724 L 292 724"/>
      <!-- Bottom-Right -->
      <path d="M 790 724 L 812 724 L 812 702"/>
    </g>

    <!-- Subtle CGEvent Vector Link from Ink Crest to Mac Cursor -->
    <path d="M 454 462 C 420 418, 372 396, 332 362"
          stroke="#38BDF8" stroke-opacity="0.40" stroke-width="2.5" stroke-dasharray="6 8" stroke-linecap="round"/>
    <circle cx="322" cy="352" r="28" stroke="#38BDF8" stroke-opacity="0.28" stroke-width="2"/>

    <!-- Hover / Squeeze Radial HUD Glow at Stylus Contact Point (566, 492) -->
    <circle cx="566" cy="492" r="150" fill="url(#hoverGlow)"/>

    <!-- Pencil Pro Radial HUD / Hover Proximity Rings -->
    <circle cx="566" cy="492" r="80"
            stroke="#38BDF8" stroke-opacity="0.38" stroke-width="2.5" stroke-dasharray="14 10"/>
    <circle cx="566" cy="492" r="46"
            stroke="#67E8F9" stroke-opacity="0.75" stroke-width="3"/>

    <!-- Radial HUD Tool Nodes (Pen / Eraser / Undo palette dots) -->
    <circle cx="566" cy="412" r="7.5" fill="#67E8F9"/>
    <circle cx="486" cy="492" r="7.5" fill="#38BDF8" fill-opacity="0.85"/>
    <circle cx="623" cy="549" r="7.5" fill="#38BDF8" fill-opacity="0.85"/>

    <!-- ===================================================================== -->
    <!-- LAYER 5: TRANSIENT INK LAYER (240 Hz Coalesced Fading Cyan Trail)     -->
    <!-- ===================================================================== -->
    <!-- Outer Neon Bloom Stroke -->
    <path d="M 268 658 C 328 678, 372 622, 400 552 C 428 482, 462 424, 506 492 C 532 532, 548 518, 566 492"
          stroke="url(#cyanInk)"
          stroke-width="28"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#inkBloom)"/>

    <!-- High-Intensity Core Ink Ribbon -->
    <path d="M 288 658 C 338 668, 374 616, 400 552 C 428 482, 462 424, 506 492 C 532 532, 548 518, 566 492"
          stroke="url(#cyanInkCore)"
          stroke-width="12"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Coalesced 240Hz Sample Nodes along the trail -->
    <circle cx="346" cy="645" r="4.5" fill="#67E8F9" opacity="0.60"/>
    <circle cx="400" cy="552" r="5.5" fill="#A5F3FC" opacity="0.85"/>
    <circle cx="454" cy="462" r="6.5" fill="#ECFEFF" opacity="0.95"/>
    <circle cx="506" cy="492" r="6.5" fill="#ECFEFF"/>

    <!-- Stylus Contact Spark -->
    <circle cx="566" cy="492" r="14" fill="#ECFEFF"/>
    <circle cx="566" cy="492" r="24" stroke="#67E8F9" stroke-width="3" opacity="0.90"/>
  </g>

  <!-- ========================================================================= -->
  <!-- LAYER 6: E2EE SECURITY & 240Hz UDP STATUS PILL (Inset cleanly from bracket)-->
  <!-- ========================================================================= -->
  <g transform="translate(618, 650)">
    <rect x="0" y="0" width="154" height="48" rx="24"
          fill="#171A24" stroke="#38BDF8" stroke-opacity="0.60" stroke-width="2.2"/>
    <!-- Live Connection Pulse Dot -->
    <circle cx="28" cy="24" r="7" fill="#10B981"/>
    <circle cx="28" cy="24" r="12.5" stroke="#10B981" stroke-opacity="0.38" stroke-width="2"/>
    <!-- AES-GCM-256 Lock Icon -->
    <rect x="56" y="22" width="18" height="14" rx="3.5" fill="#38BDF8"/>
    <path d="M 60 22 V 17 C 60 13 70 13 70 17 V 22" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 240 Hz Telemetry Bars -->
    <rect x="90" y="26" width="5" height="10" rx="2.5" fill="#67E8F9"/>
    <rect x="101" y="21" width="5" height="15" rx="2.5" fill="#67E8F9"/>
    <rect x="112" y="15" width="5" height="21" rx="2.5" fill="#67E8F9"/>
    <rect x="123" y="10" width="5" height="26" rx="2.5" fill="#38BDF8"/>
  </g>

  <!-- ========================================================================= -->
  <!-- LAYER 7: SYNTHESIZED macOS CURSOR (CGEvent Output Metaphor)               -->
  <!-- ========================================================================= -->
  <g transform="translate(314, 326) rotate(-8)" filter="url(#cursorShadow)">
    <path d="M 0 0 L 0 78 L 21 59 L 36 90 L 49 84 L 34 53 L 62 53 Z"
          fill="url(#macCursorGrad)"
          stroke="#0F172A"
          stroke-width="5"
          stroke-linejoin="round"/>
  </g>

  <!-- ========================================================================= -->
  <!-- LAYER 8: APPLE PENCIL PRO (42° Dynamic Drawing Angle + 3D Barrel Roll)    -->
  <!-- Tip anchored at (566, 492), extending up-right within Apple HIG safe area -->
  <!-- ========================================================================= -->
  <!-- Back Half of 3D Barrel Roll Orbit (Behind the Pencil Shaft) -->
  <g transform="translate(566, 492) rotate(42)">
    <path d="M -50 -168 A 50 18 0 0 1 50 -168"
          stroke="#38BDF8" stroke-width="3" stroke-dasharray="7 6" opacity="0.42"/>
  </g>

  <!-- Pencil Pro Body & Shadow -->
  <g transform="translate(566, 492) rotate(42)" filter="url(#pencilShadow)">
    <!-- 1. Precision Nib (0 to -28) -->
    <path d="M 0 0 L -9 -28 C -5 -30, 5 -30, 9 -28 Z"
          fill="url(#pencilNib)"/>

    <!-- 2. Tapered Matte Cone (-28 to -106) -->
    <path d="M -9 -28 L -26 -106 C -10 -111, 10 -111, 26 -106 L 9 -28 C 4 -30, -4 -30, -9 -28 Z"
          fill="url(#pencilCone)"/>

    <!-- Cone/Body Seam Ring -->
    <path d="M -26 -106 C -10 -111, 10 -111, 26 -106"
          stroke="#94A3B8" stroke-width="2"/>

    <!-- 3. Main Cylindrical Shaft (-106 to -418) -->
    <path d="M -26 -106 L -26 -418 C -26 -434, 26 -434, 26 -418 L 26 -106 C 10 -111, -10 -111, -26 -106 Z"
          fill="url(#pencilBody)"/>

    <!-- 4. Flat Magnetic Charging Facet on the Barrel -->
    <rect x="-11" y="-406" width="22" height="288" rx="6"
          fill="url(#pencilFacet)" opacity="0.90"/>

    <!-- Specular Rim Highlight along Left Edge of Barrel -->
    <line x1="-18" y1="-110" x2="-18" y2="-414"
          stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.88"/>

    <!-- Squeeze Haptic Zone Subtle Cyan Waves on Barrel Sides -->
    <path d="M -34 -215 Q -42 -240 -34 -265" stroke="#67E8F9" stroke-width="3.2" stroke-linecap="round" opacity="0.85"/>
    <path d="M -41 -222 Q -48 -240 -41 -258" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" opacity="0.50"/>
    <path d="M 34 -215 Q 42 -240 34 -265" stroke="#67E8F9" stroke-width="3.2" stroke-linecap="round" opacity="0.85"/>
    <path d="M 41 -222 Q 48 -240 41 -258" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" opacity="0.50"/>

    <!-- Accent Collar Band near Top Cap -->
    <path d="M -26 -388 C -10 -393, 10 -393, 26 -388 L 26 -402 C 10 -407, -10 -407, -26 -402 Z"
          fill="#64748B" opacity="0.48"/>
  </g>

  <!-- Front Half of 3D Barrel Roll Orbit (Wraps in Front of the Pencil Shaft) -->
  <g transform="translate(566, 492) rotate(42)">
    <path d="M -50 -168 A 50 18 0 0 0 50 -168"
          stroke="#67E8F9" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Directional Roll Arrowhead on Right -->
    <path d="M 40 -153 L 51 -167 L 35 -168"
          stroke="#ECFEFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>